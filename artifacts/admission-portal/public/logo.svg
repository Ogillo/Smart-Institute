<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Globe base with circuit lines -->
  <circle cx="32" cy="38" r="18" fill="#0f766e" opacity="0.12"/>
  <circle cx="32" cy="38" r="18" stroke="#0f766e" stroke-width="2" fill="none"/>
  <!-- Latitude lines -->
  <ellipse cx="32" cy="38" rx="10" ry="18" stroke="#0f766e" stroke-width="1.2" fill="none"/>
  <line x1="14" y1="38" x2="50" y2="38" stroke="#0f766e" stroke-width="1.2"/>
  <line x1="16" y1="30" x2="48" y2="30" stroke="#0f766e" stroke-width="1" opacity="0.6"/>
  <line x1="16" y1="46" x2="48" y2="46" stroke="#0f766e" stroke-width="1" opacity="0.6"/>
  <!-- Circuit dots -->
  <circle cx="14" cy="38" r="2" fill="#0d9488"/>
  <circle cx="50" cy="38" r="2" fill="#0d9488"/>
  <circle cx="32" cy="20" r="2" fill="#1e3a5f"/>
  <circle cx="32" cy="56" r="2" fill="#1e3a5f"/>
  <!-- Mortarboard board -->
  <ellipse cx="32" cy="18" rx="20" ry="5" fill="#1e3a5f"/>
  <!-- Cap top -->
  <rect x="24" y="8" width="16" height="10" rx="2" fill="#1e3a5f"/>
  <!-- Cap highlight -->
  <rect x="24" y="8" width="16" height="3" rx="2" fill="#2d5891" opacity="0.5"/>
  <!-- Tassel string -->
  <line x1="50" y1="18" x2="50" y2="26" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  <!-- Tassel bob -->
  <circle cx="50" cy="28" r="3" fill="#f59e0b"/>
  <line x1="48" y1="28" x2="46" y2="33" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="50" y1="28" x2="50" y2="34" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="52" y1="28" x2="54" y2="33" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/>
</svg>
