kind = "web"
previewPath = "/"
title = "Smart Admission Portal"
version = "1.0.0"
id = "artifacts/admission-portal"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20334

[services.development]
run = "pnpm --filter @workspace/admission-portal run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/admission-portal", "run", "build" ]
serve = "static"
publicDir = "artifacts/admission-portal/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20334"
BASE_PATH = "/"
